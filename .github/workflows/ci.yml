name: CI - Testes Java

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-pix

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: api-pix/pom.xml

      - name: Rodar testes (JUnit + Mockito) e cobertura (JaCoCo)
        run: mvn -B clean verify